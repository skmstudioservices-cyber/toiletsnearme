name: Sitemap Probe

on:
  push:
    paths:
      - '.github/workflows/sitemap-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe sitemaps + robots as Googlebot
        run: |
          GB="Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"
          SV="Mozilla/5.0 (compatible; Google-Site-Verification/1.0)"
          BB="Mozilla/5.0 (compatible; bingbot/2.0; +http://www.bing.com/bingbot.htm)"
          for u in \
            https://toiletsnearme.pages.dev/robots.txt \
            https://toiletsnearme.pages.dev/sitemap.xml \
            https://toiletsnearme.pages.dev/sitemap/pages.xml \
            https://toiletsnearme.pages.dev/sitemap/part-0.xml \
            https://toiletsnearme.pages.dev/delhi/ \
            https://toiletsnearme.pages.dev/mumbai/ ; do
            g=$(curl -sS -o /tmp/g -w "%{http_code}|%{content_type}" -m 30 -A "$GB" "$u")
            s=$(curl -sS -o /dev/null -w "%{http_code}" -m 30 -A "$SV" "$u")
            b=$(curl -sS -o /dev/null -w "%{http_code}" -m 30 -A "$BB" "$u")
            echo "$u | googlebot=$g | siteverify=$s | bingbot=$b"
          done
          echo "=== robots.txt first 6 lines (googlebot) ==="
          curl -sS -m 30 -A "$GB" https://toiletsnearme.pages.dev/robots.txt | head -6
