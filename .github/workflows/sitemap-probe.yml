name: Sitemap Probe

on:
  push:
    paths:
      - '.github/workflows/sitemap-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Beacon + Ahrefs live check
        run: |
          H=$(curl -sS -m 30 "https://toiletsnearme.pages.dev/?cb=$RANDOM")
          echo "beacon-script-tag: $(echo "$H" | grep -c '/beacon.js')"
          echo "ahrefs-script-tag: $(echo "$H" | grep -c 'analytics.ahrefs.com')"
          B=$(curl -sS -o /dev/null -w "%{http_code}|%{content_type}" -m 30 "https://toiletsnearme.pages.dev/beacon.js")
          echo "beacon.js: $B"
      - name: Robots + sitemap as Googlebot across the network
        run: |
          GB="Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"
          for host in \
            toiletsnearme.pages.dev washroomsnearme.pages.dev restareanearme.pages.dev \
            evchargersnearme.pages.dev petrolpumpsnearme.pages.dev cngpumpsnearme.pages.dev \
            karvachauth.pages.dev banksnearme.pages.dev atmsnearme.pages.dev \
            hospitalsnearme-9cp.pages.dev railwaystationnearme.pages.dev floodsnearme.pages.dev \
            templesnearme.pages.dev churchesnearme.pages.dev skmtools.pages.dev \
            mapsnearme.pages.dev demo-vmv.pages.dev ; do
            r=$(curl -sS -o /tmp/r -w "%{http_code}" -m 25 -A "$GB" "https://$host/robots.txt")
            s=$(curl -sS -o /tmp/s -w "%{http_code}|%{content_type}" -m 25 -A "$GB" "https://$host/sitemap.xml")
            rb=$(grep -ciE "^User-agent:" /tmp/r 2>/dev/null || echo 0)
            rm=$(grep -ciE "^Sitemap:" /tmp/r 2>/dev/null || echo 0)
            sz=$(wc -c < /tmp/s 2>/dev/null || echo 0)
            echo "$host | robots=$r (agents=$rb, sitemap-lines=$rm) | sitemap=$s bytes=$sz"
          done
# rerun 2026-11-20T07:10:40Z
