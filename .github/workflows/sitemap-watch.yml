name: Sitemap Watch Probe
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sitemap-watch.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Probe every sitemap
        run: |
          set +e
          probe () {
            U="$1"
            CODE=$(curl -s -L --max-time 30 -A "Mozilla/5.0 (compatible; SKM-Gate/1.0)" -o /tmp/body.xml -w "%{http_code}" "$U")
            RC=$?
            ROOT=$(grep -oE '<(urlset|sitemapindex)' /tmp/body.xml 2>/dev/null | head -1 | tr -d '<')
            LOCS=$(grep -o '<loc>' /tmp/body.xml 2>/dev/null | wc -l | tr -d ' ')
            echo "ROW|rc=$RC|$CODE|${ROOT:-none}|$LOCS|$U"
            rm -f /tmp/body.xml
          }
            probe 'https://sitemaps.india-in.workers.dev/'
            probe 'https://sitemaps.india-in.workers.dev/sitemap.xml'
            probe 'https://sitemaps.india-in.workers.dev/toiletsnearme/sitemap.xml'
            probe 'https://sitemaps.india-in.workers.dev/washroomsnearme/sitemap.xml'
            probe 'https://sitemaps.india-in.workers.dev/restareanearme/sitemap.xml'
